plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'com.victorianvoice'
version = '0.1.0'

base {
    archivesName = 'victorian-voice'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.172'
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'victorian_voice'
        }
    }
    mods {
        victorian_voice {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
